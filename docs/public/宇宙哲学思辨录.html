<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙哲学思辨录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmos-deep: #0a0a12;
            --cosmos-purple: #1a1423;
            --cosmos-blue: #16213e;
            --ink-black: #1a1a1a;
            --paper-warm: #f5f0e8;
            --paper-cream: #faf8f3;
            --gold-warm: #c9a961;
            --gold-deep: #a0823a;
            --cinnabar: #b85450;
            --cinnabar-soft: #c97874;
            --jade: #5c8d7d;
            --text-primary: #2d2a26;
            --text-secondary: #5a5650;
            --star-glow: rgba(201, 169, 97, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            background: var(--paper-cream);
            color: var(--text-primary);
            line-height: 1.95;
            font-size: 17px;
            overflow-x: hidden;
        }
        
        /* 星空背景画布 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        
        /* 内容层 */
        .content-wrapper {
            position: relative;
            z-index: 1;
        }
        
        /* 导航 */
        .nav-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, var(--paper-cream) 0%, rgba(250,248,243,0.95) 100%);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            z-index: 100;
            border-bottom: 1px solid rgba(201,169,97,0.2);
            transform: translateY(-100%);
            transition: transform 0.4s ease;
        }
        
        .nav-fixed.visible {
            transform: translateY(0);
        }
        
        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--cinnabar);
            letter-spacing: 0.1em;
        }
        
        .nav-chapters {
            display: flex;
            gap: 20px;
            font-size: 0.85em;
        }
        
        .nav-chapters a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .nav-chapters a:hover {
            color: var(--cinnabar);
            background: rgba(184,84,80,0.05);
        }
        
        /* 封面 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(201,169,97,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(184,84,80,0.05) 0%, transparent 50%),
                var(--paper-cream);
            position: relative;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 80px;
            background: linear-gradient(180deg, transparent, var(--gold-warm), transparent);
        }
        
        .hero-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            color: var(--ink-black);
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            position: relative;
        }
        
        .hero-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--cinnabar);
            margin: 30px auto;
        }
        
        .hero-subtitle {
            font-size: 1.3em;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.05em;
            max-width: 600px;
            line-height: 1.8;
        }
        
        .hero-meta {
            margin-top: 60px;
            display: flex;
            gap: 40px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }
        
        .hero-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .hero-meta-item::before {
            content: '◆';
            color: var(--gold-warm);
            font-size: 0.6em;
        }
        
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: var(--text-secondary);
            font-size: 0.85em;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }
        
        /* 章节容器 */
        .chapter {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 30px;
            position: relative;
        }
        
        .chapter:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 60px;
            background: linear-gradient(180deg, var(--gold-warm), transparent);
        }
        
        /* 章节标题 */
        .chapter-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 600;
            color: var(--cinnabar);
            margin-bottom: 10px;
            letter-spacing: 0.08em;
        }
        
        .chapter-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.6em;
            font-weight: 400;
            color: var(--gold-warm);
            display: block;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .chapter-subtitle {
            font-size: 1.1em;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(201,169,97,0.3);
        }
        
        /* 小节标题 */
        h3 {
            font-size: 1.4em;
            font-weight: 600;
            color: var(--text-primary);
            margin: 50px 0 20px;
            padding-left: 15px;
            border-left: 3px solid var(--cinnabar);
        }
        
        h4 {
            font-size: 1.15em;
            font-weight: 500;
            color: var(--text-primary);
            margin: 30px 0 15px;
        }
        
        /* 段落 */
        p {
            margin-bottom: 20px;
            text-align: justify;
            text-indent: 2em;
            color: var(--text-primary);
        }
        
        p:first-of-type::first-letter {
            font-size: 3em;
            float: left;
            line-height: 1;
            margin-right: 10px;
            margin-top: -5px;
            color: var(--cinnabar);
            font-weight: 700;
        }
        
        /* 引用块 */
        blockquote {
            background: linear-gradient(135deg, rgba(201,169,97,0.08) 0%, rgba(184,84,80,0.05) 100%);
            border-left: 4px solid var(--cinnabar);
            padding: 25px 30px;
            margin: 30px 0;
            font-style: italic;
            color: var(--text-secondary);
            position: relative;
        }
        
        blockquote::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 4em;
            color: var(--gold-warm);
            opacity: 0.3;
            font-family: 'Cormorant Garamond', serif;
            line-height: 1;
        }
        
        blockquote p {
            text-indent: 0;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        blockquote p:last-child {
            margin-bottom: 0;
        }
        
        /* 表格 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: rgba(250,248,243,0.8);
            font-size: 0.95em;
        }
        
        th {
            background: var(--cinnabar);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 500;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(201,169,97,0.2);
        }
        
        tr:hover {
            background: rgba(201,169,97,0.05);
        }
        
        /* 列表 */
        ul, ol {
            margin: 20px 0;
            padding-left: 2em;
        }
        
        li {
            margin-bottom: 10px;
        }
        
        /* 强调 */
        strong {
            color: var(--cinnabar);
            font-weight: 600;
        }
        
        /* 分隔线 */
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-warm), transparent);
            margin: 60px 0;
        }
        
        /* 哲学概念卡片 */
        .concept-card {
            background: linear-gradient(135deg, rgba(92,141,125,0.08) 0%, rgba(201,169,97,0.05) 100%);
            border: 1px solid rgba(201,169,97,0.3);
            border-radius: 8px;
            padding: 25px;
            margin: 30px 0;
        }
        
        .concept-card-title {
            color: var(--jade);
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .concept-card-title::before {
            content: '◉';
            color: var(--gold-warm);
        }
        
        /* 人物卡片 */
        .philosopher-card {
            background: linear-gradient(135deg, rgba(184,84,80,0.05) 0%, rgba(201,169,97,0.05) 100%);
            border-left: 4px solid var(--cinnabar);
            padding: 25px;
            margin: 30px 0;
        }
        
        .philosopher-name {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--cinnabar);
            margin-bottom: 10px;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 100px 40px;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(201,169,97,0.1) 0%, transparent 70%),
                var(--paper-cream);
            position: relative;
        }
        
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 60px;
            background: linear-gradient(180deg, var(--gold-warm), transparent);
        }
        
        .footer-seal {
            width: 100px;
            height: 100px;
            margin: 20px auto 30px;
            background: var(--cinnabar);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            font-weight: 700;
            box-shadow: 0 10px 40px rgba(184,84,80,0.3);
        }
        
        .footer-text {
            color: var(--text-secondary);
            font-size: 1.1em;
            max-width: 500px;
            margin: 0 auto;
            line-height: 2;
        }
        
        .footer-quote {
            font-style: italic;
            color: var(--cinnabar);
            margin-top: 30px;
            font-size: 1.2em;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .nav-chapters {
                display: none;
            }
            
            .hero-title {
                font-size: 2.2em;
            }
            
            .hero-meta {
                flex-direction: column;
                gap: 10px;
            }
            
            .chapter {
                padding: 60px 20px;
            }
            
            p:first-of-type::first-letter {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    
    <div class="content-wrapper">
        <!-- 导航 -->
        <nav class="nav-fixed" id="navbar">
            <div class="nav-content">
                <div class="nav-title">宇宙哲学思辨录</div>
                <div class="nav-chapters">
                    <a href="#ch1">哲学源流</a>
                    <a href="#ch2">逻辑数学</a>
                    <a href="#ch3">物理宇宙</a>
                    <a href="#ch4">天人合一</a>
                    <a href="#ch5">李小龙</a>
                </div>
            </div>
        </nav>
        
        <!-- 封面 -->
        <header class="hero">
            <h1 class="hero-title">宇宙哲学思辨录</h1>
            <p class="hero-subtitle">从古希腊广场到截拳道道场 · 贯通逻辑数学物理宇宙 · 归于天人合一</p>
            
            <div class="hero-meta">
                <span class="hero-meta-item">五章深度思辨</span>
                <span class="hero-meta-item">五万字宏篇</span>
                <span class="hero-meta-item">东西方智慧对话</span>
            </div>
            
            <div class="scroll-hint">向下滚动探索 ↓</div>
        </header>
        
        <!-- 正文内容 -->
        <main id="main-content">
            <!-- 第一章 -->
            <section class="chapter" id="ch1">
                <div id="content-ch1"></div>
            </section>
            
            <!-- 第二章 -->
            <section class="chapter" id="ch2">
                <div id="content-ch2"></div>
            </section>
            
            <!-- 第三章 -->
            <section class="chapter" id="ch3">
                <div id="content-ch3"></div>
            </section>
            
            <!-- 第四章 -->
            <section class="chapter" id="ch4">
                <div id="content-ch4"></div>
            </section>
            
            <!-- 第五章 -->
            <section class="chapter" id="ch5">
                <div id="content-ch5"></div>
            </section>
        </main>
        
        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-seal">道</div>
            <p class="footer-text">
                如水般流动，如星空般广阔，如初心般真诚
            </p>
            <p class="footer-quote">"Be water, my friend." —— 李小龙</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 星空背景动画
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        function createStars() {
            stars = [];
            const count = Math.floor((width * height) / 10000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.5 + 0.2,
                    speed: Math.random() * 0.2 + 0.05
                });
            }
        }
        
        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(201, 169, 97, ${star.opacity})`;
                ctx.fill();
            });
            
            requestAnimationFrame(animateStars);
        }
        
        resize();
        createStars();
        animateStars();
        window.addEventListener('resize', () => { resize(); createStars(); });
        
        // 导航显示/隐藏
        const navbar = document.getElementById('navbar');
        let lastScroll = 0;
        
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll > 500) {
                navbar.classList.add('visible');
            } else {
                navbar.classList.remove('visible');
            }
            lastScroll = currentScroll;
        });
        
        // 加载并渲染各章节内容
        async function loadContent() {
            try {
                const response = await fetch('PHILO-001-final.md');
                const markdown = await response.text();
                
                // 配置 marked
                marked.setOptions({
                    headerIds: true,
                    gfm: true,
                    breaks: true
                });
                
                // 按章节分割并渲染
                const sections = markdown.split(/## 第[一二三四五]章：/);
                
                // 第一章
                if (sections[1]) {
                    document.getElementById('content-ch1').innerHTML = marked.parse('## 第一章：' + sections[1]);
                }
                // 第二章
                if (sections[2]) {
                    document.getElementById('content-ch2').innerHTML = marked.parse('## 第二章：' + sections[2]);
                }
                // 第三章
                if (sections[3]) {
                    document.getElementById('content-ch3').innerHTML = marked.parse('## 第三章：' + sections[3]);
                }
                // 第四章
                if (sections[4]) {
                    document.getElementById('content-ch4').innerHTML = marked.parse('## 第四章：' + sections[4]);
                }
                // 第五章
                if (sections[5]) {
                    document.getElementById('content-ch5').innerHTML = marked.parse('## 第五章：' + sections[5]);
                }
                
            } catch (error) {
                console.error('加载失败:', error);
                document.querySelectorAll('[id^="content-ch"]').forEach(el => {
                    el.innerHTML = '<p style="text-align:center;color:var(--cinnabar);">内容加载失败，请刷新页面重试</p>';
                });
            }
        }
        
        loadContent();
    </script>
</body>
</html>
